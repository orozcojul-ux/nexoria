<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0A0613"/>
    </radialGradient>
    <radialGradient id="gem" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Glow effect -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
  <!-- Crown / N lettermark -->
  <!-- Stylized N -->
  <path d="M18 44 L18 20 L26 20 L38 36 L38 20 L46 20 L46 44 L38 44 L26 28 L26 44 Z"
        fill="url(#gem)" stroke="#c084fc" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Crown spikes above N -->
  <path d="M20 20 L20 14 L24 18 L28 12 L32 18 L36 12 L40 18 L44 14 L44 20"
        stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Gem dots on crown -->
  <circle cx="28" cy="12.5" r="2" fill="#fbbf24"/>
  <circle cx="36" cy="12.5" r="2" fill="#fbbf24"/>
  <circle cx="20" cy="14.5" r="1.5" fill="#c084fc"/>
  <circle cx="44" cy="14.5" r="1.5" fill="#c084fc"/>
</svg>
